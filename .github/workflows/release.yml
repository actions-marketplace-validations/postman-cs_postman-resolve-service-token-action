name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      release_kind: ${{ steps.release_tag.outputs.release_kind }}
      package_version: ${{ steps.release_tag.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify release tag classification
        id: release_tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "$PKG_VERSION"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Release workflow must run from an accepted immutable tag; got $GITHUB_REF; expected v$PKG_VERSION, v$MAJOR.$MINOR when patch is zero, or v$MAJOR"
            exit 1
          fi
          if [ "$TAG_VERSION" = "$PKG_VERSION" ] || { [ "$PATCH" = 0 ] && [ "$TAG_VERSION" = "$MAJOR.$MINOR" ]; }; then
            echo "release_kind=immutable" >> "$GITHUB_OUTPUT"
          elif [ "$TAG_VERSION" = "$MAJOR" ]; then
            echo "release_kind=alias" >> "$GITHUB_OUTPUT"
            echo "::notice::Rolling alias $GITHUB_REF_NAME requires no publication work."
          else
            echo "::error::Release workflow must run from an accepted immutable tag; got $GITHUB_REF; expected v$PKG_VERSION, v$MAJOR.$MINOR when patch is zero, or v$MAJOR"
            exit 1
          fi

  verify-package:
    needs: classify
    if: ${{ needs.classify.outputs.release_kind == 'immutable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.11 "$RUNNER_TEMP"
          echo "ACTIONLINT_BIN=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      - run: npm run bundle
      - name: Run gates
        run: |
          set -uo pipefail
          declare -A pid=() result=(); declare -a names=(); MAX_PARALLEL_GATES=2
          finish_one() { local finished_pid status n; if wait -n -p finished_pid "${pid[@]}"; then status=0; else status=$?; fi; for n in "${!pid[@]}"; do if [ "${pid[$n]}" = "$finished_pid" ]; then result[$n]=$status; unset 'pid[$n]'; return; fi; done; }
          run() { while [ "${#pid[@]}" -ge "$MAX_PARALLEL_GATES" ]; do finish_one; done; local n=$1; shift; names+=("$n"); ( "$@" ) >"$n.log" 2>&1 & pid[$n]=$!; }
          run lint npm run lint
          run test npm test
          run typecheck npm run typecheck
          run dist npm run verify:dist:assert
          run actionlint "$ACTIONLINT_BIN"
          while [ "${#pid[@]}" -gt 0 ]; do finish_one; done
          fail=0; for n in "${names[@]}"; do if [ "${result[$n]}" -eq 0 ]; then echo "gate:$n=pass"; else echo "gate:$n=fail"; fail=1; fi; cat "$n.log"; done; exit $fail
      - name: Package release bytes
        run: |
          mkdir release-stage
          npm pack --pack-destination release-stage
          mv release-stage/*.tgz release-stage/release.tgz
          bash scripts/build-sea.sh
          VERSION="${{ needs.classify.outputs.package_version }}"
          BIN="build/sea/postman-resolve-service-token-${VERSION}-linux-x64"
          out="$(env -i PATH=/nonexistent "$BIN" 2>&1 || true)"
          echo "$out" | grep -qE 'is missing or invalid|is required'
          test "$(env -i PATH=/nonexistent "$BIN" --version)" = "$VERSION"
          test "$(NODE_OPTIONS='--this-flag-does-not-exist' "$BIN" --version)" = "$VERSION"
          node scripts/assert-sea-proxy.mjs "$BIN" api.getpostman.com:443 --postman-api-key proxy-smoke-key --postman-team-id proxy-smoke-team
          cp "$BIN" "$BIN.sha256" release-stage/
          mkdir -p release-stage/scripts
          cp scripts/verify-release-artifacts.mjs release-stage/scripts/
          node - <<'NODE'
          const { createHash } = require('node:crypto'); const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const files = readdirSync('release-stage').filter((path) => path !== 'release-manifest.json');
          const sha256 = (path) => createHash('sha256').update(readFileSync(`release-stage/${path}`)).digest('hex');
          writeFileSync('release-stage/release-manifest.json', `${JSON.stringify({ schema_version: 1, repository: process.env.GITHUB_REPOSITORY, commit_sha: process.env.GITHUB_SHA, tag: process.env.GITHUB_REF_NAME, package_name: require('./package.json').name, package_version: require('./package.json').version, artifacts: files.map((path) => ({ path, sha256: sha256(path) })) }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-stage/
          if-no-files-found: error

  publish:
    needs: [classify, verify-package]
    if: ${{ needs.classify.outputs.release_kind == 'immutable' && needs.verify-package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify checksummed release artifacts
        run: |
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto'; import { existsSync, readFileSync } from 'node:fs'; import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(readFileSync('release-manifest.json'));
          for (const [key, expected] of Object.entries({ repository: process.env.GITHUB_REPOSITORY, commit_sha: process.env.GITHUB_SHA, tag: process.env.GITHUB_REF_NAME })) if (manifest[key] !== expected) throw new Error(`manifest ${key} mismatch`);
          const packageJson = JSON.parse(execFileSync('tar', ['-xOf', 'release.tgz', 'package/package.json'], { encoding: 'utf8' }));
          if (packageJson.name !== manifest.package_name || packageJson.version !== manifest.package_version) throw new Error('tarball package identity mismatch');
          for (const artifact of manifest.artifacts) { if (!/^[a-f0-9]{64}$/.test(artifact.sha256) || !existsSync(artifact.path)) throw new Error(`missing or invalid artifact ${artifact.path}`); const actual = createHash('sha256').update(readFileSync(artifact.path)).digest('hex'); if (actual !== artifact.sha256) throw new Error(`checksum mismatch for ${artifact.path}`); }
          NODE
      - name: Publish or verify npm package identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -e "const m=require('./release-manifest.json'); console.log(m.package_name)")
          PKG_VERSION=$(node -e "const m=require('./release-manifest.json'); console.log(m.package_version)")
          if INTEGRITY=$(npm view "$PKG_NAME@$PKG_VERSION" dist.integrity 2>/dev/null); then
            ACTUAL=$(node -e "const {createHash}=require('node:crypto'); console.log('sha512-'+createHash('sha512').update(require('node:fs').readFileSync('release.tgz')).digest('base64'))")
            test "$INTEGRITY" = "$ACTUAL" || { echo '::error::existing npm package integrity differs from staged tarball'; exit 1; }
          else
            npm publish ./release.tgz --provenance --access public
          fi
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            release.tgz
            postman-resolve-service-token-*-linux-x64
            postman-resolve-service-token-*-linux-x64.sha256
            release-manifest.json

  advance-major-alias:
    needs: [classify, publish]
    if: ${{ needs.classify.outputs.release_kind == 'immutable' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Advance rolling major alias without regression
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; MAJOR="v${VERSION%%.*}"; CANDIDATE="v$VERSION"
          CURRENT=$(git tag -l "$MAJOR")
          if [ -n "$CURRENT" ] && [ "$(printf '%s\n%s\n' "${CURRENT#v}" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then echo "::notice::not advancing $MAJOR because it already targets newer $CURRENT"; exit 0; fi
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -fa "$MAJOR" -m "Rolling $MAJOR alias -> $CANDIDATE" "$GITHUB_SHA"
          git push origin "$MAJOR" --force

  dispatch-live-monitor:
    needs: [classify, publish]
    if: ${{ needs.classify.outputs.release_kind == 'immutable' && needs.publish.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - env:
          E2E_DISPATCH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          E2E_GATE_SUITE: smoke
        run: node .github/scripts/dispatch-e2e-monitor.mjs
